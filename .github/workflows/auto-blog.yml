
name: Automatic Beauty Blog Publishing

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * 1,3,5"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate blog articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python blog-automation/publish_blog.py

      - name: Publish new blog files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish new beauty blog"
            git push
          else
            echo "No new blog files to publish."
          fi
